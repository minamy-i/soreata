<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>それ！できて当たり前？ — デモ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
    <style>
        /* ---- デザイン変数 ---- */
        :root {
            --bg: #222233;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.60);
            --text-dim: rgba(255, 255, 255, 0.88);
            --dark: #1a1918;
            --border: rgba(255, 255, 255, 0.18);
            --border-strong: rgba(255, 255, 255, 0.55);
            --bg-subtle: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            --radius-card: 18px;
            --radius-btn: 24px;
            --radius-inner: 10px;
            --max-width: 680px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            line-height: 1.75;
            padding: 52px 20px 100px;
        }

        /* ---- 背景キャンバス ---- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ---- ヘッダー ---- */
        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-family: 'Hachi Maru Pop', sans-serif;
            font-size: 2.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text);
            line-height: 1.7;
        }

        /* ---- デモバナー ---- */
        .demo-banner {
            background: rgba(250, 210, 0, 0.12);
            border: 1px solid rgba(250, 210, 0, 0.35);
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 0.82rem;
            color: rgba(250, 210, 0, 0.9);
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.02em;
        }

        /* ---- カード（すりガラス） ---- */
        .card {
            background: rgba(64, 64, 64, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            padding: 26px 28px;
            margin-bottom: 20px;
        }

        /* ---- ステップバッジ ---- */
        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--dark);
            background: var(--text);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .card-title {
            display: flex;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
            margin-bottom: 16px;
        }

        /* ---- ボタン共通 ---- */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: var(--radius-btn);
            font-weight: 700;
            transition: background 0.15s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }

        /* サブボタン：白枠 */
        .btn-sub {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border-strong);
            padding: 7px 20px;
            font-size: 0.85rem;
        }

        .btn-sub:hover { background: rgba(255, 255, 255, 0.12); }
        .btn-copy { margin-left: auto; font-size: 0.78rem; padding: 4px 14px; }

        /* ---- アクション行 ---- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        /* ---- テキストエリア（読み取り専用） ---- */
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-inner);
            padding: 14px 16px;
            font-family: inherit;
            font-size: 0.97rem;
            color: var(--text);
            resize: none;
            outline: none;
            cursor: default;
        }

        textarea::placeholder { color: rgba(255, 255, 255, 0.35); }

        /* ---- 例ボタン ---- */
        .example-area {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .example-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .example-btn {
            font-size: 0.78rem;
            color: var(--text-dim);
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            transition: background 0.15s;
        }

        .example-btn:hover { background: rgba(255, 255, 255, 0.16); }

        /* ---- アコーディオン ---- */
        .accordion-item {
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            margin-bottom: 8px;
            overflow: hidden;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            background: var(--bg-subtle);
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.93rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }

        .accordion-header:hover { background: rgba(255, 255, 255, 0.14); }

        .accordion-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 12px;
            transition: transform 0.2s;
        }

        .accordion-icon.open { transform: rotate(180deg); }

        .accordion-body {
            padding: 14px 18px;
            font-size: 0.88rem;
            line-height: 1.8;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
        }

        /* ---- チェックボックス ---- */
        .accordion-check {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-strong);
            border-radius: 4px;
            flex-shrink: 0;
            cursor: pointer;
            margin-right: 10px;
            position: relative;
        }

        .accordion-check:checked {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.85);
        }

        .accordion-check:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: var(--dark);
            font-weight: 800;
            line-height: 1;
        }

        .accordion-title { flex: 1; }

        /* ---- 当人は？ブロック ---- */
        .person-line {
            display: block;
            background: rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            padding: 5px 10px;
            margin: 6px 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.86rem;
        }

        /* ---- 非表示 ---- */
        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">

        <header>
            <h1>それ！できて当たり前？</h1>
            <p class="subtitle">あれ？何故できないんだろう？<br>その困りごと、一緒に考えてみましょう。<br>「できて当たり前」とされる行動・指示も<br>要素と必要な能力に分解し対策を提案します。</p>
        </header>

        <div class="demo-banner">デモ版 — サンプルデータをご利用ください。<br>公開版では、実際の困りごとを入力してお使いいただけます。</div>

        <!-- STEP 1: デモ課題選択 -->
        <div class="card">
            <div class="card-title">
                <span class="step-badge">1</span>困りごとを入力する
            </div>
            <textarea id="task-input" rows="4" readonly placeholder="下のデモ課題を選択してください"></textarea>
            <div class="example-area">
                <span class="example-label">例（クリックで入力）：</span>
                <button class="example-btn" onclick="selectSample(this, 'hashiru')">走り回る2歳児を紙芝居へ注目させる</button>
                <button class="example-btn" onclick="selectSample(this, 'tarokun')">小学校低学年の子が「太郎くんのうしろに並んで」の指示がわからない</button>
                <button class="example-btn" onclick="selectSample(this, 'oodama')">中学生の体育祭の「大玉送り」で、相手チームの邪魔に行かないようにする</button>
                <button class="example-btn" onclick="selectSample(this, 'daigakusei')">大学での試験会場が講義室と違う場合があると知らなかった</button>
                <button class="example-btn" onclick="selectSample(this, 'shakaijin')">既に何年も勤めている会社で新しい仕事の手順を覚えるのに時間がかかる</button>
            </div>
            <div class="action-row">
                <button class="btn-sub" onclick="resetAll()">クリア</button>
            </div>
        </div>

        <!-- 分解・対応の一覧 -->
        <div class="card hidden" id="section-rendered">
            <div class="card-title">
                <span class="step-badge">↓</span>分解・対応の一覧
                <button class="btn-sub btn-copy" id="btn-copy" onclick="copyResult()">コピー</button>
            </div>
            <div id="output-rendered"></div>
        </div>

    </div>

    <script>
        // ---- 背景描画 ----
        function drawBackground() {
            const canvas = document.getElementById('bg-canvas');
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            const colors = [
                'rgba(230,40,40,0.70)',
                'rgba(20,180,175,0.85)',
                'rgba(250,210,0,0.75)',
                'rgba(220,40,140,0.68)',
                'rgba(40,190,80,0.68)',
                'rgba(200,40,200,0.62)',
                'rgba(110,60,230,0.65)',
                'rgba(20,140,240,0.68)',
            ];

            const rand = (min, max) => Math.random() * (max - min) + min;
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];

            for (let i = 0; i < 180; i++) {
                const x = rand(0, W);
                const y = rand(0, H);
                const color = pick(colors);
                const shape = Math.floor(rand(0, 5));

                ctx.globalAlpha = Math.min(1, y / 280);
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rand(0, Math.PI * 2));

                switch (shape) {
                    case 0:
                        ctx.beginPath();
                        ctx.arc(0, 0, rand(18, 48), 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        break;
                    case 1:
                        ctx.beginPath();
                        ctx.arc(0, 0, rand(22, 52), 0, Math.PI * 2);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = rand(4, 8);
                        ctx.stroke();
                        break;
                    case 2:
                        const ps = rand(18, 42);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = rand(5, 10);
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(-ps, 0); ctx.lineTo(ps, 0);
                        ctx.moveTo(0, -ps); ctx.lineTo(0, ps);
                        ctx.stroke();
                        break;
                    case 3:
                        const ss = rand(18, 46);
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        for (let j = 0; j < 4; j++) {
                            const a  = (j * Math.PI) / 2;
                            const a1 = a - Math.PI / 4;
                            const a2 = a + Math.PI / 4;
                            if (j === 0) ctx.moveTo(Math.cos(a1) * ss * 0.38, Math.sin(a1) * ss * 0.38);
                            ctx.lineTo(Math.cos(a) * ss, Math.sin(a) * ss);
                            ctx.lineTo(Math.cos(a2) * ss * 0.38, Math.sin(a2) * ss * 0.38);
                        }
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 4:
                        const ds = rand(18, 40);
                        ctx.fillStyle = color;
                        ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
                        break;
                }

                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        drawBackground();
        window.addEventListener('resize', drawBackground);

        // ---- サンプルデータ（data/samples.json と同期） ----
        const samplesData = [

                        "person": "体を動かさないと、どこにいるか分からなくて不安だよ。じっとしていられない。",
                        "solution": "膝の上で揺らす、回転椅子でゆっくり回すなど、静止したまま前庭覚を満たせる身体的関わりを行い、落ち着きを促す。"

                        "person": "身体の境界がぼやけて、自分がどこまでなのかわからず、空中に浮いているような不安がある。紙芝居の絵よりも、自分の輪郭を確認するために動くことだけが頼りだ。",
                        "solution": "重みのあるクッションを抱かせる、または膝に乗せるなど、身体に圧迫感を与えることで感覚を満たし、安心感を提供して注視を助ける。"

                        "person": "今、何が起きたの？さっきの場面と今の場面がどうつながっているのか、よく分からないよ。",

                        "person": "みんなが何をしているか見ていないよ。自分は今、走り回ることに夢中なんだ。",

            {

        // ---- サンプル選択 ----
        function selectSample(btn, id) {
            const sample = samplesData.find(s => s.id === id);
            if (!sample) return;

            document.getElementById('task-input').value = sample.task;
            renderAccordion(sample.abilities);
        }

        let currentAbilities = [];

        // サンプルデータをアコーディオンに変換して表示する
        function renderAccordion(abilities) {
            currentAbilities = abilities;
            const container = document.getElementById('output-rendered');
            container.innerHTML = '';

            abilities.forEach(({ title, description, person, solution }) => {
                const item = document.createElement('div');
                item.className = 'accordion-item';
                item.innerHTML = `
                    <button class="accordion-header" onclick="toggleAccordion(this)">
                        <input type="checkbox" class="accordion-check" onclick="event.stopPropagation()">
                        <span class="accordion-title">${title}</span>
                        <span class="accordion-icon">▼</span>
                    </button>
                    <div class="accordion-body hidden">
                        <div class="ability-description">${description.replace(/\n/g, '<br>')}</div>
                        <span class="person-line">当人は？ ${person}</span>
                        <div class="ability-solution"><strong>対応：</strong>${solution}</div>
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('section-rendered').classList.remove('hidden');
        }

        // 分解結果を全文コピーする
        function copyResult() {
            const lines = currentAbilities.map(({ title, description, person, solution }) =>
                `${title}\n${description}\n当人は？ ${person}\n対応：${solution}`
            );

            navigator.clipboard.writeText(lines.join('\n\n')).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.textContent = 'コピーしました';
                setTimeout(() => { btn.textContent = 'コピー'; }, 2000);
            });
        }

        function toggleAccordion(btn) {
            const body = btn.nextElementSibling;
            const icon = btn.querySelector('.accordion-icon');
            const isOpen = !body.classList.contains('hidden');
            body.classList.toggle('hidden');
            icon.classList.toggle('open', !isOpen);
        }

        function resetAll() {
            document.getElementById('task-input').value = '';
            document.getElementById('output-rendered').innerHTML = '';
            document.getElementById('section-rendered').classList.add('hidden');
        }
    </script>
</body>
