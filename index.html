<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>それ！できて当たり前？</title>
    <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
    <style>
        /* ---- デザイン変数 ---- */
        :root {
            --bg: #222233;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.60);
            --text-dim: rgba(255, 255, 255, 0.88);
            --dark: #1a1918;
            --border: rgba(255, 255, 255, 0.18);
            --border-strong: rgba(255, 255, 255, 0.55);
            --bg-subtle: rgba(255, 255, 255, 0.08);
            --color-error: #ff8080;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
            --radius-card: 18px;
            --radius-btn: 24px;
            --radius-inner: 10px;
            --max-width: 680px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            line-height: 1.75;
            padding: 52px 20px 100px;
        }

        /* ---- 背景キャンバス ---- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ---- ヘッダー ---- */
        header {
            text-align: center;
            margin-bottom: 52px;
        }

        h1 {
            font-family: 'Hachi Maru Pop', sans-serif;
            font-size: 2.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text);
            line-height: 1.7;
        }

        /* ---- カード（すりガラス） ---- */
        .card {
            background: rgba(64, 64, 64, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            padding: 26px 28px;
            margin-bottom: 20px;
        }

        /* ---- ステップバッジ（白統一） ---- */
        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--dark);
            background: var(--text);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .card-title {
            display: flex;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
            margin-bottom: 16px;
        }

        /* ---- テキストエリア ---- */
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-inner);
            padding: 14px 16px;
            font-family: inherit;
            font-size: 0.97rem;
            color: var(--text);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea::placeholder { color: rgba(255, 255, 255, 0.35); }
        textarea:focus { border-color: var(--border-strong); }

        /* ---- ボタン共通 ---- */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: var(--radius-btn);
            font-weight: 700;
            transition: background 0.15s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }

        /* 主要ボタン：白 */
        .btn-main {
            background: var(--text);
            color: var(--dark);
            padding: 11px 30px;
            font-size: 0.95rem;
        }

        .btn-main:hover { background: rgba(255, 255, 255, 0.85); }

        .btn-main:disabled {
            background: rgba(255, 255, 255, 0.35);
            cursor: not-allowed;
            transform: none;
        }

        /* サブボタン：白枠 */
        .btn-sub {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border-strong);
            padding: 7px 20px;
            font-size: 0.85rem;
        }

        .btn-sub:hover { background: rgba(255, 255, 255, 0.12); }
        .btn-copy { margin-left: auto; font-size: 0.78rem; padding: 4px 14px; }

        /* ---- アクション行 ---- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        /* ---- 例ボタン ---- */
        .example-area {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .example-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .example-btn {
            font-size: 0.78rem;
            color: var(--text-dim);
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            transition: background 0.15s;
        }

        .example-btn:hover { background: rgba(255, 255, 255, 0.16); }

        /* ---- ローディング ---- */
        .loading {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* ---- エラー ---- */
        .error-msg {
            font-size: 0.88rem;
            color: var(--color-error);
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255, 80, 80, 0.15);
            border-radius: 8px;
        }

        /* ---- アコーディオン ---- */
        .accordion-item {
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            margin-bottom: 8px;
            overflow: hidden;
        }

        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            background: var(--bg-subtle);
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.93rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }

        .accordion-header:hover { background: rgba(255, 255, 255, 0.14); }

        .accordion-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 12px;
            transition: transform 0.2s;
        }

        .accordion-icon.open { transform: rotate(180deg); }

        .accordion-body {
            padding: 14px 18px;
            font-size: 0.88rem;
            line-height: 1.8;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
        }

        /* ---- チェックボックス（アコーディオンヘッダー内） ---- */
        .accordion-check {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-strong);
            border-radius: 4px;
            flex-shrink: 0;
            cursor: pointer;
            margin-right: 10px;
            position: relative;
        }

        .accordion-check:checked {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.85);
        }

        .accordion-check:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: var(--dark);
            font-weight: 800;
            line-height: 1;
        }

        .accordion-title { flex: 1; }

        /* ---- 当人は？ブロック ---- */
        .person-line {
            display: block;
            background: rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            padding: 5px 10px;
            margin: 6px 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.86rem;
        }

        /* ---- 非表示 ---- */
        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">

        <header>
            <h1>それ！できて当たり前？</h1>
            <p class="subtitle">あれ？何故できないんだろう？<br>その困りごと、一緒に考えてみましょう。<br>「できて当たり前」とされる行動・指示も<br>要素と必要な能力に分解し対策を提案します。</p>
        </header>

        <!-- STEP 1: 課題入力 -->
        <div class="card">
            <div class="card-title">
                <span class="step-badge">1</span>困りごとを入力する
            </div>
            <textarea id="task-input" rows="4" placeholder="行動や指示を入力してください"></textarea>
            <div class="example-area">
                <span class="example-label">例（クリックで入力）：</span>
                <button class="example-btn" onclick="setExample(this)">走り回る2歳児を紙芝居へ注目させる</button>
                <button class="example-btn" onclick="setExample(this)">小学校低学年の子が「太郎くんのうしろに並んで」の指示がわからない</button>
                <button class="example-btn" onclick="setExample(this)">中学生の体育祭の「大玉送り」で、相手チームの邪魔に行かないようにする</button>
                <button class="example-btn" onclick="setExample(this)">大学での試験会場が講義室と違う場合があると知らなかった</button>
                <button class="example-btn" onclick="setExample(this)">既に何年も勤めている会社で新しい仕事の手順を覚えるのに時間がかかる</button>
            </div>
            <div class="action-row">
                <button class="btn-main" id="btn-decompose" onclick="decompose()">分解する</button>
                <button class="btn-sub" onclick="resetAll()">クリア</button>
                <span class="loading hidden" id="loading">分解中...</span>
            </div>
            <div class="error-msg hidden" id="error-msg"></div>
        </div>

        <!-- 分解・対応の一覧 -->
        <div class="card hidden" id="section-rendered">
            <div class="card-title">
                <span class="step-badge">↓</span>分解・対応の一覧
                <button class="btn-sub btn-copy" id="btn-copy" onclick="copyResult()">コピー</button>
            </div>
            <div id="output-rendered"></div>
        </div>

    </div>

    <script>
        // ---- ガチャガチャ背景 ----
        function drawBackground() {
            const canvas = document.getElementById('bg-canvas');
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            const colors = [
                'rgba(230,40,40,0.70)',
                'rgba(20,180,175,0.85)',
                'rgba(250,210,0,0.75)',
                'rgba(220,40,140,0.68)',
                'rgba(40,190,80,0.68)',
                'rgba(200,40,200,0.62)',
                'rgba(110,60,230,0.65)',
                'rgba(20,140,240,0.68)',
            ];

            const rand = (min, max) => Math.random() * (max - min) + min;
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];

            for (let i = 0; i < 180; i++) {
                const x = rand(0, W);
                const y = rand(0, H);
                const color = pick(colors);
                const shape = Math.floor(rand(0, 5));

                // 上部ほど図形を薄くする
                ctx.globalAlpha = Math.min(1, y / 280);
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rand(0, Math.PI * 2));

                switch (shape) {
                    case 0: // 塗り円
                        ctx.beginPath();
                        ctx.arc(0, 0, rand(18, 48), 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        break;
                    case 1: // 輪郭円
                        ctx.beginPath();
                        ctx.arc(0, 0, rand(22, 52), 0, Math.PI * 2);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = rand(4, 8);
                        ctx.stroke();
                        break;
                    case 2: // プラス
                        const ps = rand(18, 42);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = rand(5, 10);
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(-ps, 0); ctx.lineTo(ps, 0);
                        ctx.moveTo(0, -ps); ctx.lineTo(0, ps);
                        ctx.stroke();
                        break;
                    case 3: // 4角星
                        const ss = rand(18, 46);
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        for (let j = 0; j < 4; j++) {
                            const a  = (j * Math.PI) / 2;
                            const a1 = a - Math.PI / 4;
                            const a2 = a + Math.PI / 4;
                            if (j === 0) ctx.moveTo(Math.cos(a1) * ss * 0.38, Math.sin(a1) * ss * 0.38);
                            ctx.lineTo(Math.cos(a) * ss, Math.sin(a) * ss);
                            ctx.lineTo(Math.cos(a2) * ss * 0.38, Math.sin(a2) * ss * 0.38);
                        }
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 4: // 四角
                        const ds = rand(18, 40);
                        ctx.fillStyle = color;
                        ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
                        break;
                }

                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        drawBackground();
        window.addEventListener('resize', drawBackground);

        function resetAll() {
            document.getElementById('task-input').value = '';
            document.getElementById('output-rendered').innerHTML = '';
            document.getElementById('section-rendered').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('task-input').focus();
        }

        function setExample(btn) {
            document.getElementById('task-input').value = btn.textContent;
        }

        async function decompose() {
            const task = document.getElementById('task-input').value.trim();
            if (!task) return;

            const btnDecompose = document.getElementById('btn-decompose');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');

            btnDecompose.disabled = true;
            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            document.getElementById('section-rendered').classList.add('hidden');
            document.getElementById('output-rendered').innerHTML = '';

            try {
                const response = await fetch('/api/decompose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'エラーが発生しました');
                }

                renderAccordion(data.abilities);

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btnDecompose.disabled = false;
                loading.classList.add('hidden');
            }
        }

        // 分解結果を保持する
        let currentAbilities = [];

        // abilities 配列をアコーディオンに変換して表示する
        function renderAccordion(abilities) {
            currentAbilities = abilities;
            const container = document.getElementById('output-rendered');
            container.innerHTML = '';

            abilities.forEach(({ title, description, person, solution }) => {
                const item = document.createElement('div');
                item.className = 'accordion-item';
                item.innerHTML = `
                    <button class="accordion-header" onclick="toggleAccordion(this)">
                        <input type="checkbox" class="accordion-check" onclick="event.stopPropagation()">
                        <span class="accordion-title">${title}</span>
                        <span class="accordion-icon">▼</span>
                    </button>
                    <div class="accordion-body hidden">
                        <div class="ability-description">${description.replace(/\n/g, '<br>')}</div>
                        <span class="person-line">当人は？ ${person}</span>
                        <div class="ability-solution"><strong>対応：</strong>${solution}</div>
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('section-rendered').classList.remove('hidden');
        }

        // 分解結果を全文コピーする
        function copyResult() {
            const lines = currentAbilities.map(({ title, description, person, solution }) =>
                `${title}\n${description}\n当人は？ ${person}\n対応：${solution}`
            );

            navigator.clipboard.writeText(lines.join('\n\n')).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.textContent = 'コピーしました';
                setTimeout(() => { btn.textContent = 'コピー'; }, 2000);
            });
        }

        function toggleAccordion(btn) {
            const body = btn.nextElementSibling;
            const icon = btn.querySelector('.accordion-icon');
            const isOpen = !body.classList.contains('hidden');
            body.classList.toggle('hidden');
            icon.classList.toggle('open', !isOpen);
        }
    </script>
</body>
</html>
